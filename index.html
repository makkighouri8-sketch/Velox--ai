<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velox AI</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome Icons for Mic, Plus, Send -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Modern Sidebar for Chat History -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="newChatBtn">
        <i class="fa-solid fa-plus"></i> New Chat
      </button>
      <button class="icon-btn sidebar-toggle-btn" id="sidebarCloseBtn" title="Close Sidebar">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-item active">Current Session</div>
    </div>
  </aside>

  <!-- Main App Wrapper for Sidebar Push Layout -->
  <div class="app-wrapper">
    <!-- Top Minimal Header -->
    <header class="header">
      <div class="logo-container">
        <button class="icon-btn" id="sidebarToggleBtn" title="Toggle Sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </header>

    <!-- Main Chat Area -->
    <main class="chat-container" id="chatContainer">
      <div class="welcome-screen" id="welcomeScreen">
        <h1>Hello, Jamshed</h1>
        <p>How can Velox help you today?</p>

        <!-- Quick Action Chips -->
        <div class="quick-chips">
          <button class="chip" data-prompt="Write a clean, modern Python Flask API script">
            <i class="fa-solid fa-code"></i> Write Python Code
          </button>
          <button class="chip" data-prompt="Give me 5 futuristic neon logo ideas for my tech brand">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Neon Logo Ideas
          </button>
          <button class="chip" data-prompt="Debug this JavaScript code and explain the fix">
            <i class="fa-solid fa-bug"></i> Fix My Script
          </button>
          <button class="chip" data-prompt="Draft a professional freelance proposal for a web app">
            <i class="fa-solid fa-rocket"></i> Client Proposal
          </button>
        </div>
      </div>
    </main>

    <!-- Input Area (Gemini Style) -->
    <div class="input-container">
      <div class="input-box">
        
        <!-- Plus Menu Button & Popover -->
        <div class="plus-menu-wrapper">
          <button class="icon-btn" id="plusBtn" title="Add Attachment">
            <i class="fa-solid fa-plus"></i>
          </button>
          <div class="plus-dropdown" id="plusDropdown">
            <label class="menu-item">
              <i class="fa-solid fa-file-arrow-up"></i> Add File
              <input type="file" id="fileInput" hidden />
            </label>
            <label class="menu-item">
              <i class="fa-solid fa-image"></i> Add Photo
              <input type="file" id="photoInput" accept="image/*" hidden />
            </label>
            <button class="menu-item" id="cameraBtn">
              <i class="fa-solid fa-camera"></i> Camera
            </button>
          </div>
        </div>

        <!-- Text Input Field -->
        <textarea id="userInput" placeholder="Ask Velox..." rows="1"></textarea>

        <!-- Mic & Send Buttons -->
        <div class="right-actions">
          <button class="icon-btn" id="micBtn" title="Voice Search">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <button class="icon-btn send-btn" id="sendBtn" title="Send Message">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
